name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: repinspect
          POSTGRES_PASSWORD: repinspect
          POSTGRES_DB: repinspect_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U repinspect"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The tests read this; the default already matches the service above.
      TEST_DATABASE_URL: postgresql+psycopg://repinspect:repinspect@localhost:5433/repinspect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The tests use a fake embedding model, but the package still imports PyTorch. The
      # CPU-only wheel avoids downloading several GB of CUDA libraries.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the production compose file
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          POSTGRES_PASSWORD: ci
          JWT_SECRET: ci
      - name: Build the web image
        run: docker build frontend
