# Development services. The backend and frontend run on the host for now;
# they will be added here once the core application is stable.
services:
  db:
    image: postgres:17-alpine
    container_name: repinspect-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repinspect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repinspect}
      POSTGRES_DB: ${POSTGRES_DB:-repinspect}
    ports:
      # Host port 5433 avoids clashing with a PostgreSQL already installed locally.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repinspect}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
