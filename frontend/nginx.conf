# Serves the built web app and forwards /api to the backend, so the browser sees one origin
# (same-site cookies, no CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # Uploaded ZIPs may be up to 50 MB (MAX_UPLOAD_BYTES), plus a little overhead.
    client_max_body_size 55m;

    location /api/ {
        # The API sets its own security headers.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite rather than append: the backend trusts this value for rate limiting,
        # so a client must not be able to supply its own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # File names contain a content hash, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    # Any other path is a page of the single-page app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }
}
